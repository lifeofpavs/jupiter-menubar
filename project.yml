name: jupiter-menubar
options:
  bundleIdPrefix: dev.raccoons
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  jupiter-menubar:
    type: application
    platform: macOS
    sources:
      - path: jupiter-menubar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raccoons.jupiter-menubar
        PRODUCT_NAME: "Jupiter MenuBar"
        INFOPLIST_FILE: jupiter-menubar/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    entitlements:
      path: jupiter-menubar/Resources/jupiter-menubar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
